<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Poland National Visa D (Erasmus) Checklist" />
    <meta name="theme-color" content="#071c14" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
    <title>Poland Visa D Checklist</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar glass">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="img">
              <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#g)" />
              <path d="M20 24h24v4H20zM20 32h24v4H20zM20 40h16v4H20z" fill="#fff" />
              <defs>
                <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#0f9d63" />
                  <stop offset="100%" stop-color="#1e7f4f" />
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div>
            <h1 data-i18n="appTitle">Poland Visa D Checklist</h1>
            <p data-i18n="appSubtitle">Erasmus+ National Visa Companion</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle theme">
            <span data-icon="theme"></span>
          </button>
          <select id="languageSelect" class="select-pill" aria-label="Language selector">
            <option value="en">English</option>
            <option value="ar">العربية</option>
          </select>
          <button id="installButton" class="primary-btn hidden" type="button" data-i18n="installApp">Install App</button>
        </div>
      </header>

      <nav class="bottom-nav glass" aria-label="Primary navigation">
        <button class="nav-btn active" data-view="dashboard" type="button">
          <span data-icon="dashboard"></span>
          <span data-i18n="navDashboard">Dashboard</span>
        </button>
        <button class="nav-btn" data-view="documents" type="button">
          <span data-icon="documents"></span>
          <span data-i18n="navDocuments">Documents</span>
        </button>
        <button class="nav-btn" data-view="planner" type="button">
          <span data-icon="planner"></span>
          <span data-i18n="navPlanner">Planner</span>
        </button>
        <button class="nav-btn" data-view="timeline" type="button">
          <span data-icon="timeline"></span>
          <span data-i18n="navTimeline">Timeline</span>
        </button>
        <button class="nav-btn" data-view="statistics" type="button">
          <span data-icon="statistics"></span>
          <span data-i18n="navStatistics">Statistics</span>
        </button>
        <button class="nav-btn" data-view="settings" type="button">
          <span data-icon="settings"></span>
          <span data-i18n="navSettings">Settings</span>
        </button>
      </nav>

      <main class="main-content">
        <section id="dashboardView" class="view-panel active" aria-label="Dashboard"></section>
        <section id="documentsView" class="view-panel" aria-label="Documents"></section>
        <section id="plannerView" class="view-panel" aria-label="Planner"></section>
        <section id="timelineView" class="view-panel" aria-label="Timeline"></section>
        <section id="statisticsView" class="view-panel" aria-label="Statistics"></section>
        <section id="settingsView" class="view-panel" aria-label="Settings"></section>
      </main>
    </div>

    <div id="detailModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="documentModalTitle">
      <div class="modal-card glass">
        <button class="modal-close" id="closeModal" type="button" aria-label="Close">×</button>
        <div id="modalContent"></div>
      </div>
    </div>

    <div id="conditionModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="conditionModalTitle">
      <div class="modal-card glass small">
        <h3 id="conditionModalTitle" data-i18n="conditionalTitle">A few quick questions</h3>
        <p data-i18n="conditionalHint">These help hide unnecessary documents.</p>
        <form id="conditionForm" class="stack"></form>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="script.js"></script>
  </body>
</html>
